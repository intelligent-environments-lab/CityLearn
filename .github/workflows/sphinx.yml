name: Sphinx build

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        # Documentation only needs Ubuntu's Pandoc package.
        sudo rm -f \
          /etc/apt/sources.list.d/google-chrome.list \
          /etc/apt/sources.list.d/google-chrome.sources
        sudo apt-get update
        sudo apt-get install -y pandoc
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r test_requirements.txt -r docs/requirements.txt
    - name: Test documentation examples
      run: python -m pytest -q tests/test_documentation_examples.py
    - name: Build and check HTML
      run: |
        sphinx-apidoc citylearn -o docs/source/api -e -M
        sphinx-build -b html docs/source docs/build/html
        python scripts/ci/check_docs.py docs/build/html
    - name: Save documentation preview
      uses: actions/upload-artifact@v4
      with:
        name: documentation-html
        path: docs/build/html
        retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: documentation-html
        path: docs/build/html
    - name: Add CNAME
      env:
        CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      run: printf '%s\n' "$CUSTOM_DOMAIN" > docs/build/html/CNAME
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/build/html
